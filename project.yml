name: WXQRCodeAuth
options:
  bundleIdPrefix: com.wxqr
  deploymentTarget:
    iOS: "13.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  # 兼容 GitHub Actions runner 上的 Xcode 15（默认会生成 Xcode 16 的 format 77）
  compatibilityVersion: "Xcode 14.0"

settings:
  base:
    MARKETING_VERSION: "10.2.3"
    CURRENT_PROJECT_VERSION: "1023"
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_STYLE: Manual
    ONLY_ACTIVE_ARCH: NO
    ENABLE_BITCODE: NO

targets:
  WXQRCodeAuth:
    type: application
    platform: iOS
    sources:
      - path: WXQRCodeAuth
    info:
      path: WXQRCodeAuth/Info.plist
      properties:
        CFBundleDisplayName: 微信显码
        CFBundleShortVersionString: "10.2.3"
        CFBundleVersion: "1023"
        CFBundlePackageType: APPL
        CFBundleSignature: "????"
        LSRequiresIPhoneOS: true
        MinimumOSVersion: "13.0"
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIStatusBarStyle: UIStatusBarStyleDefault
        UIBackgroundModes:
          - fetch
        # 接管微信 URL Scheme：设备不装微信时，第三方 App（百度等）唤起微信会跳到本 App
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.tencent.xin
            CFBundleURLSchemes:
              - weixin
              - weixinULAPI
              - weixinURLParamsAPI
              - wechat
              - weixinapp
              - wexinVideoAPI
        LSApplicationQueriesSchemes:
          - weixin
          - weixinULAPI
          - weixinURLParamsAPI
          - wechat
          - baiduboxapp
          - baiduboxlite
          - baidunetdisk
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wxqr.qrauth
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
